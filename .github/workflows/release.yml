name: Release

on:
  workflow_run:
    workflows:
      - Test
    types:
      - completed

permissions:
  contents: read

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
      TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify tested tag and source version
        shell: bash
        run: |
          if ! git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            printf '%s is not a tag\n' "$RELEASE_TAG" >&2
            exit 1
          fi
          tag_sha="$(git rev-list -n 1 "$RELEASE_TAG")"
          if [[ "$tag_sha" != "$TESTED_SHA" ]]; then
            printf 'Tag %s points to %s, but Test passed for %s\n' "$RELEASE_TAG" "$tag_sha" "$TESTED_SHA" >&2
            exit 1
          fi
          version="$(sed -n 's/^const Version = "\([^"]*\)"$/\1/p' internal/cli/version.go)"
          if [[ -z "$version" ]]; then
            echo "Could not read Version from internal/cli/version.go" >&2
            exit 1
          fi
          if [[ "$RELEASE_TAG" != "v$version" ]]; then
            printf 'Tag %s does not match source version %s\n' "$RELEASE_TAG" "$version" >&2
            exit 1
          fi

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            printf 'Release %s already exists\n' "$RELEASE_TAG"
            exit 0
          fi
          gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "$RELEASE_TAG"
